apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/penchalj/kubernetes-voting-app-cicd.git
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true        # ← Enable Prune
      selfHeal: true     # ← Enable Self Heal
    syncOptions:
      - CreateNamespace=true
