name: Build and Deploy Voting App to EKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: penchaljdevops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # -------------------------------------------------
    # Build & Push Docker images
    # -------------------------------------------------
    - name: Build and push Vote image
      uses: docker/build-push-action@v5
      with:
        context: ./vote
        push: true
        tags: |
          ${{ env.DOCKERHUB_USERNAME }}/vote:latest
          ${{ env.DOCKERHUB_USERNAME }}/vote:${{ github.sha }}

    - name: Build and push Result image
      uses: docker/build-push-action@v5
      with:
        context: ./result
        push: true
        tags: |
          ${{ env.DOCKERHUB_USERNAME }}/result:latest
          ${{ env.DOCKERHUB_USERNAME }}/result:${{ github.sha }}

    - name: Build and push Worker image
      uses: docker/build-push-action@v5
      with:
        context: ./worker
        push: true
        tags: |
          ${{ env.DOCKERHUB_USERNAME }}/worker:latest
          ${{ env.DOCKERHUB_USERNAME }}/worker:${{ github.sha }}

    # -------------------------------------------------
    # Deploy to EKS
    # -------------------------------------------------
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name penchal-voting-app-cluster --region us-east-1

    - name: Deploy Kubernetes manifests
      run: |
        kubectl apply -f k8s/

    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get svc
        kubectl get ingress
