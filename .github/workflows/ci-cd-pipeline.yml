name: Build, SonarCloud, Update Images (GitOps)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - '.github/workflows/ci-cd-pipeline.yml'
  workflow_dispatch:

jobs:
  build-sonar-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Required to push updated manifests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0         # Required for better SonarCloud analysis
        token: ${{ secrets.GITHUB_TOKEN }}

    # -------------------------------------------------
    # SonarCloud Analysis (Single Project)
    # -------------------------------------------------
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=penchalj_kubernetes-voting-app-cicd
          -Dsonar.organization=penchalj
          -Dsonar.sources=vote,result,worker
          -Dsonar.python.version=3.11
          -Dsonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**

    # -------------------------------------------------
    # Docker Build & Push
    # -------------------------------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Vote image
      uses: docker/build-push-action@v5
      with:
        context: ./vote
        push: true
        tags: |
          penchaljdevops/vote-app:latest
          penchaljdevops/vote-app:${{ github.sha }}

    - name: Build and push Result image
      uses: docker/build-push-action@v5
      with:
        context: ./result
        push: true
        tags: |
          penchaljdevops/result-app:latest
          penchaljdevops/result-app:${{ github.sha }}

    - name: Build and push Worker image
      uses: docker/build-push-action@v5
      with:
        context: ./worker
        push: true
        tags: |
          penchaljdevops/worker-app:latest
          penchaljdevops/worker-app:${{ github.sha }}

    # -------------------------------------------------
    # Update image tags in Kubernetes manifests (GitOps)
    # -------------------------------------------------
    - name: Update image tags in manifests
      run: |
        echo "Updating manifests with image tag: ${{ github.sha }}"

        # Vote
        sed -i "s|image: .*vote.*|image: penchaljdevops/vote-app:${{ github.sha }}|g" k8s/base/vote-deployment.yml

        # Result
        sed -i "s|image: .*result.*|image: penchaljdevops/result-app:${{ github.sha }}|g" k8s/base/result-deployment.yml

        # Worker
        sed -i "s|image: .*worker.*|image: penchaljdevops/worker-app:${{ github.sha }}|g" k8s/base/worker-deployment.yml

        echo "=== Updated images ==="
        grep -E "image:" k8s/base/vote-deployment.yml k8s/base/result-deployment.yml k8s/base/worker-deployment.yml

    - name: Commit and push updated manifests
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/base/
        git diff --staged --quiet || git commit -m "chore: update images to ${{ github.sha }}"
        git push
