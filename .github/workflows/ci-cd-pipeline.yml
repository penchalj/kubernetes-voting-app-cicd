name: Build, SonarCloud, Deploy Voting App to EKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-sonar-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # Required for better SonarCloud analysis

    # -------------------------------------------------
    # SonarCloud Analysis (Single Project)
    # -------------------------------------------------
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=penchalj_kubernetes-voting-app-cicd
          -Dsonar.organization=penchalj
          -Dsonar.sources=vote,result,worker
          -Dsonar.python.version=3.11
          -Dsonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**

    # -------------------------------------------------
    # Docker Build & Push
    # -------------------------------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Vote image
      uses: docker/build-push-action@v5
      with:
        context: ./vote
        push: true
        tags: |
          penchaljdevops/vote-app:latest
          penchaljdevops/vote-app:${{ github.sha }}

    - name: Build and push Result image
      uses: docker/build-push-action@v5
      with:
        context: ./result
        push: true
        tags: |
          penchaljdevops/result-app:latest
          penchaljdevops/result-app:${{ github.sha }}

    - name: Build and push Worker image
      uses: docker/build-push-action@v5
      with:
        context: ./worker
        push: true
        tags: |
          penchaljdevops/worker-app:latest
          penchaljdevops/worker-app:${{ github.sha }}

    # -------------------------------------------------
    # Deploy to EKS
    # -------------------------------------------------
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name penchal-voting-app-cluster --region us-east-1

    - name: Deploy Kubernetes manifests
      run: |
        kubectl apply -f k8s/

    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get svc
        kubectl get ingress
