name: Build and Deploy Voting App to EKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # -------------------------------------------------
    # Note: Currently we are using public images.
    # Later you can replace these steps with real builds
    # when you have your own Dockerfiles.
    # -------------------------------------------------

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --name penchal-voting-app-cluster --region us-east-1

    - name: Deploy Kubernetes manifests
      run: |
        kubectl apply -f redis-deployment.yml
        kubectl apply -f postgres-deployment.yml
        kubectl apply -f db-service.yml
        kubectl apply -f vote-deployment.yml
        kubectl apply -f result-deployment.yml
        kubectl apply -f worker-deployment.yml
        kubectl apply -f voting-app-ingress.yml

    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get svc
        kubectl get ingress
